
name: DeathPenalty
version: '2.0.0'
main: id.server.deathpenalty.DeathPenalty
api-version: '1.21'
description: Death penalty with Darkness I, Weakness V and Slowness V.

commands:
  penalty:
    description: Manage player death penalties
    usage: /penalty <clear|check> <player>
    permission: deathpenalty.admin

permissions:
  deathpenalty.admin:
    description: Allows managing death penalties
    default: op
    
