
name: Build DeathPenalty2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathPenalty2
          path: target/DeathPenalty-2.0.0.jar
          
